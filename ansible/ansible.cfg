# ---------------------------------------------------------------------------
# Ansible config for the Meridian platform repo.
# RULE: comments go on their OWN line. Ansible does NOT strip a "#" written
# after a value on the same line — it swallows it into the value and errors.
# ---------------------------------------------------------------------------

[defaults]
# where Ansible looks for roles (relative to this file)
roles_path = roles
# default inventory when -i is not passed on the command line
inventory = inventories/dev
# pretty, human-readable task output
stdout_callback = yaml
# don't prompt to accept unknown SSH host keys (lab only — not for prod)
host_key_checking = False
# gather facts only when a play needs them (faster repeat runs)
gathering = smart
# vault password file — stays disabled until E2 introduces secrets
# vault_password_file = .vault-pass

[privilege_escalation]
# become another user (root) for tasks that need it
become = True
# escalate via sudo
become_method = sudo
# don't pause to prompt for a sudo password mid-run
become_ask_pass = False

[ssh_connection]
# run a play's tasks over a single SSH session — big speed-up
pipelining = True