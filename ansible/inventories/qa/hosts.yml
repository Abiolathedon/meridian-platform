---
# hosts.yml — the QA inventory. Hosts grouped by FUNCTION (app/db/k8s);
# the environment itself = this folder (qa), chosen with -i inventories/qa.

app:                               # function group "app" = application hosts
  hosts:                           # the machines in this group
    exodus-qa-app-01:              # our qa application host (a fresh golden clone)
      ansible_host: 192.168.0.180  # its target IP (name isn't in DNS yet)
