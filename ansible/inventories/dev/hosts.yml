---
# hosts.yml — the DEV inventory. Hosts are grouped by FUNCTION (app/db/k8s);
# the environment itself = this folder (dev), chosen with -i inventories/dev.

app:                               # function group "app" = application hosts
  hosts:                           # the machines in this group
    exodus-dev-app-01:             # our dev application host
      ansible_host: 192.168.0.163  # its IP (name isn't in DNS yet)