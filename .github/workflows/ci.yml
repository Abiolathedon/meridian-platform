---
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Match the control node's runtime: Python 3.11. ansible-core 2.14 does NOT
      # run on Python 3.12 (ubuntu-latest's default), so we pin the runtime too.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.11"
      # Pin the linters to the SAME versions as the local venv (RHEL's ansible-core 2.14,
      # ansible-lint < 24) so CI and local never drift apart.
      - name: Install linters
        run: pip install "yamllint<2" "ansible-core==2.14.*" "ansible-lint<24"
      - name: Run yamllint
        run: yamllint .
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint
