---
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Pin the linters to the SAME versions as the local venv (RHEL's ansible-core 2.14,
      # ansible-lint < 24) so CI and local never drift apart.
      - name: Install linters
        run: pip install "yamllint<2" "ansible-core==2.14.*" "ansible-lint<24"
      - name: Run yamllint
        run: yamllint .
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint
